name: v1.1 packaged Windows QA

on:
  push:
    branches:
      - feature/v1.1.0-multi-watch-folders
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  packaged-release-qa:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime and packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Verify FFmpeg LFS payloads are materialized
        shell: pwsh
        run: |
          $ffmpeg = Get-Item app/ffmpeg/bin/ffmpeg.exe
          $ffprobe = Get-Item app/ffmpeg/bin/ffprobe.exe
          if ($ffmpeg.Length -lt 1000000) { throw "ffmpeg.exe appears to be an LFS pointer or invalid payload ($($ffmpeg.Length) bytes)." }
          if ($ffprobe.Length -lt 1000000) { throw "ffprobe.exe appears to be an LFS pointer or invalid payload ($($ffprobe.Length) bytes)." }

      - name: Build release package
        shell: cmd
        run: build.bat release

      - name: Verify packaged structure
        shell: pwsh
        run: |
          $required = @(
            'dist_release/ClipDis/ClipDis.exe',
            'dist_release/ClipDis/_internal',
            'dist_release/ClipDis/_internal/app/gui/main.qml',
            'dist_release/ClipDis/_internal/app/ffmpeg/bin/ffmpeg.exe',
            'dist_release/ClipDis/_internal/app/ffmpeg/bin/ffprobe.exe',
            'dist_release/ClipDis/_internal/app/ffmpeg/bin/LICENSE'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing packaged release requirement: $path" }
          }
          $icu = Get-ChildItem 'dist_release/ClipDis' -Recurse -Filter 'icu*.dll' -ErrorAction SilentlyContinue
          if ($icu) {
            $paths = ($icu | ForEach-Object FullName) -join "`n"
            throw "Unexpected ICU DLLs were packaged:`n$paths"
          }

      - name: Run packaged diagnostics in clean appdata
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'clipdis-packaged-qa'
          $env:APPDATA = Join-Path $root 'Roaming'
          $env:LOCALAPPDATA = Join-Path $root 'Local'
          $env:QT_QPA_PLATFORM = 'offscreen'
          New-Item -ItemType Directory -Force -Path $env:APPDATA, $env:LOCALAPPDATA | Out-Null

          $exe = Resolve-Path 'dist_release/ClipDis/ClipDis.exe'
          $checks = @('--smoke-check', '--qml-smoke-check', '--diagnose')
          foreach ($check in $checks) {
            $process = Start-Process -FilePath $exe -ArgumentList $check -PassThru -Wait -NoNewWindow
            if ($process.ExitCode -ne 0) {
              throw "Packaged ClipDis failed $check with exit code $($process.ExitCode)."
            }
          }

      - name: Verify clean first-run state was isolated
        shell: pwsh
        run: |
          if (Test-Path 'dist_release/ClipDis/config.json') { throw 'User config was written into release directory.' }
          if (Test-Path 'dist_release/ClipDis/state.db') { throw 'User database was written into release directory.' }
