name: Release v1.1.0

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, 'Release v1.1.0')
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pefile

      - name: Verify FFmpeg LFS payloads
        shell: pwsh
        run: |
          $ffmpeg = Get-Item 'app/ffmpeg/bin/ffmpeg.exe'
          $ffprobe = Get-Item 'app/ffmpeg/bin/ffprobe.exe'
          if ($ffmpeg.Length -lt 1000000) { throw 'ffmpeg.exe is not materialized from Git LFS.' }
          if ($ffprobe.Length -lt 1000000) { throw 'ffprobe.exe is not materialized from Git LFS.' }

      - name: Run backend regression suite
        shell: pwsh
        run: |
          python -m compileall -q main.py app tests
          python -m unittest discover -s tests -v

      - name: Build release package
        shell: cmd
        run: cmd /c build.bat release

      - name: Verify release package structure
        shell: pwsh
        run: |
          $root = 'dist_release/ClipDis'
          $required = @(
            "$root/ClipDis.exe",
            "$root/_internal",
            "$root/_internal/app/gui/main.qml",
            "$root/_internal/app/gui/assets/app_icon.ico",
            "$root/_internal/app/gui/assets/app_icon.png",
            "$root/_internal/app/ffmpeg/bin/ffmpeg.exe",
            "$root/_internal/app/ffmpeg/bin/ffprobe.exe",
            "$root/_internal/app/ffmpeg/bin/LICENSE"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing required packaged file: $path" }
          }
          $icu = Get-ChildItem $root -Recurse -Filter 'icu*.dll' -ErrorAction SilentlyContinue
          if ($icu) { throw "Unexpected ICU DLL(s) packaged: $($icu.FullName -join ', ')" }

      - name: Verify EXE has Windows icon resource
        shell: pwsh
        run: |
          @'
          import pefile
          pe = pefile.PE(r'dist_release/ClipDis/ClipDis.exe')
          if not hasattr(pe, 'DIRECTORY_ENTRY_RESOURCE'):
              raise SystemExit('No PE resource directory found')
          found = False
          for entry in pe.DIRECTORY_ENTRY_RESOURCE.entries:
              if entry.id == pefile.RESOURCE_TYPE['RT_GROUP_ICON']:
                  found = True
                  break
          if not found:
              raise SystemExit('ClipDis.exe is missing RT_GROUP_ICON')
          print('windows_icon_resource=True')
          '@ | python -

      - name: Run packaged checks with clean AppData
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'clipdis-release-appdata'
          $env:APPDATA = Join-Path $root 'Roaming'
          $env:LOCALAPPDATA = Join-Path $root 'Local'
          $env:QT_QPA_PLATFORM = 'offscreen'
          New-Item -ItemType Directory -Force -Path $env:APPDATA | Out-Null
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          & 'dist_release/ClipDis/ClipDis.exe' --smoke-check
          if ($LASTEXITCODE -ne 0) { throw 'Packaged smoke check failed.' }
          & 'dist_release/ClipDis/ClipDis.exe' --qml-smoke-check
          if ($LASTEXITCODE -ne 0) { throw 'Packaged QML smoke check failed.' }
          & 'dist_release/ClipDis/ClipDis.exe' --diagnose
          if ($LASTEXITCODE -ne 0) { throw 'Packaged diagnostics failed.' }

      - name: Create release ZIP and checksum
        shell: pwsh
        run: |
          $version = 'v1.1.0'
          $zip = "ClipDis-$version-windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path 'dist_release/ClipDis/*' -DestinationPath $zip -CompressionLevel Optimal
          $staging = Join-Path $env:RUNNER_TEMP 'clipdis-zip-verify'
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $staging
          if (-not (Test-Path "$staging/ClipDis.exe")) { throw 'ZIP top level is missing ClipDis.exe.' }
          if (-not (Test-Path "$staging/_internal")) { throw 'ZIP top level is missing _internal.' }
          if (Test-Path "$staging/ClipDis/ClipDis.exe") { throw 'ZIP incorrectly contains an extra ClipDis directory.' }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content -Encoding ascii 'SHA256SUMS.txt'
          Write-Host "release_zip=$zip"
          Write-Host "sha256=$hash"

      - name: Write release notes
        shell: pwsh
        run: |
          @'
          # ClipDis v1.1.0 — Multi-Watch Folders

          This release changes ClipDis from a single watch/archive pair into a multi-profile clip uploader.

          ## Highlights
          - Multiple watch folders, each with a stable profile identity.
          - Automatic `ClipDis Uploaded` archive inside every watch folder.
          - No manual Uploaded Folder configuration.
          - Per-watch-folder Valorant rank/level toggle.
          - Per-watch-folder custom Discord caption.
          - Dashboard source badges and folder filtering.
          - Profile-specific Open Folder and Clear Uploaded actions.
          - Clear-one and Clear-all previews with file counts, sizes, and explicit confirmations.
          - Automatic v1.0 configuration migration with backup.
          - Archive folders are excluded from scanning so uploaded clips cannot be rediscovered.
          - Discord captions suppress mentions such as `@everyone`.
          - Improved Windows packaging checks and ICU DLL exclusion.

          ## Installation
          1. Download `ClipDis-v1.1.0-windows-x64.zip`.
          2. Extract the entire ZIP to a normal folder.
          3. Run `ClipDis.exe`.
          4. Keep `_internal` beside `ClipDis.exe`; it is required.

          Existing v1.0 settings are migrated automatically. The legacy uploaded folder is left untouched.

          ## Verification
          The release is built from the merged `main` commit on a fresh Windows GitHub Actions runner. The workflow verifies the Windows icon resource, packaged QML/assets, bundled FFmpeg/FFprobe and license, backend tests, packaged smoke/QML/diagnostic checks, and ZIP layout before publishing.
          '@ | Set-Content -Encoding utf8 'release-notes.md'

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create v1.1.0 --draft --target "$env:GITHUB_SHA" --title 'v1.1.0 - Multi-Watch Folders' --notes-file release-notes.md

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release upload v1.1.0 'ClipDis-v1.1.0-windows-x64.zip' 'SHA256SUMS.txt' --clobber

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release edit v1.1.0 --draft=false --latest
          gh release view v1.1.0
